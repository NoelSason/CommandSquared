name: Control

options:
  bundleIdPrefix: com.noelsason
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with a real identity, not ad-hoc. An ad-hoc signature pins its
    # designated requirement to the exact binary hash, so macOS treats every
    # rebuild as a different app and drops the Accessibility grant. A Developer
    # ID signature keys on identifier + team, which is stable across builds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: 3D8X943476
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # Skip the round trip to Apple's timestamp server on every local build.
      OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  # Pure logic: vault, matching, Jev. No AppKit, no Accessibility.
  # Split out so `xcodebuild test` never has to launch the app (which would
  # register a global hotkey and prompt for Accessibility on every test run).
  ControlKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ControlKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noelsason.ControlKit
        PRODUCT_NAME: ControlKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Control:
    type: application
    platform: macOS
    sources:
      - path: Sources/Control
    dependencies:
      - target: ControlKit
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noelsason.Control
        PRODUCT_NAME: Control
        INFOPLIST_FILE: Sources/Control/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Control/Resources/Control.entitlements
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  ControlKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ControlKitTests
    dependencies:
      - target: ControlKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noelsason.ControlKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Control:
    build:
      targets:
        Control: all
        ControlKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ControlKitTests
